<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ayuda | Sonrisa Uruguaya</title>
    <style>
      :root {
        --bg: #f4f8f7;
        --primary: #3f7d73;
        --primary-dark: #2d5f59;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
      }

      body {
        display: flex;
        flex-direction: column;
      }

      .topbar {
        background: linear-gradient(135deg, #edf8f5 0%, #dfeee9 100%);
        border-bottom: 1px solid rgba(63, 125, 115, 0.12);
        padding: 16px 24px;
      }

      .topbar-inner {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        color: var(--primary-dark);
        font-weight: 700;
        font-size: 1.1rem;
      }

      .back-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 16px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.9rem;
        box-shadow: 0 10px 18px rgba(63, 125, 115, 0.18);
      }

      .frame-wrap {
        flex: 1;
        width: 100%;
        padding: 0;
        background: white;
      }

      iframe {
        width: 100%;
        height: calc(100vh - 72px);
        border: 0;
        display: block;
        background: white;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbar-inner">
        <div class="brand">Sonrisa Uruguaya • Centro de ayuda</div>
        <a href="/" class="back-btn">Volver a la clínica</a>
      </div>
    </div>

    <div class="frame-wrap">
      <iframe
        src="https://www.chatbase.co/1V_BuINGVg8YWNmAyBptn/help"
        title="Chatbase Help"
        loading="lazy"
        allow="clipboard-write; fullscreen"
      ></iframe>
    </div>
  </body>
</html>
